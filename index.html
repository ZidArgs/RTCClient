<!doctype html>
<html>

<head>
    <script type="module" defer>
        import RTCClient from "./RTCClient.js";

        const DEFAULT_CONFIG = {
            iceServers: [{
                urls: 'stun:stun.l.google.com:19302'
            }]
        };

        let host_name = document.getElementById("host_name");
        let host_button = document.getElementById("host_button");
        
        let instances = document.getElementById("instances");
        let refresh_button = document.getElementById("refresh_button");
        let join_button = document.getElementById("join_button");
        
        let chat_history = document.getElementById("chat_history");
        let chat_text = document.getElementById("chat_text");
        let send = document.getElementById("send");
        
        let rtc = new RTCClient(8001, DEFAULT_CONFIG);

        rtc.onmessage = function (sender, msg) {
            chat_history.value += `========== ${sender} ==========\n${msg}\n\n`;
        };

        send.addEventListener("click", function() {
            rtc.send(chat_text.value);
            chat_history.value += `=========== YOU ===========\n${chat_text.value}\n\n`;
            chat_text.value = "";
        });

        host_button.addEventListener("click", async function() {
            if (!!host_name.value) {
                await rtc.register(host_name.value);
            }
        });

        join_button.addEventListener("click", async function() {
            if (!!instances.value) {
                await rtc.connect(instances.value);
            }
        });

        refresh_button.addEventListener("click", async function refresh() {
            let res = await rtc.getInstances();

            instances.innerHTML = "";

            res.forEach(function(el) {
                let opt = document.createElement("option");
                opt.value = el.name;
                opt.innerHTML = el.name;
                instances.append(opt);
            });
        });

    </script>
</head>

<body>
    <fieldset>
        <h3>HOST</h3>
        <input id="host_name">
        <button id="host_button">create</button>
    </fieldset>
    <fieldset>
        <h3>JOIN</h3>
        <select id="instances"></select>
        <button id="refresh_button">refresh</button>
        <button id="join_button">join</button>
    </fieldset>
    <fieldset>
        <h3>CHAT</h3>
        <textarea id="chat_history" style="height: 400px; width: 100%" readonly></textarea>
        <textarea id="chat_text" style="height: 100px; width: 100%"></textarea>
        <button id="send">send</button>
    </fieldset>
</body>

</html>
